<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16122a">
<title>Mistwalkers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#16122a;--panel:rgba(22,18,40,.78);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--text:#f4f1ff;--muted:#b9b2d8;--accent:#ffcf4a;--accent2:#8a5cff;--good:#5be38a;--bad:#ff5a6a;--warn:#ffb03a;--r:16px;
--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui button{font-family:inherit}
.hidden{display:none!important}
button{cursor:pointer}
/* ── HUD ── */
#status{position:absolute;left:calc(12px + var(--safeL));top:calc(10px + var(--safeT));display:flex;gap:10px;align-items:center;background:var(--panel);padding:8px 12px 8px 8px;border-radius:var(--r);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:250px}
.portrait{position:relative;width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#3a2e66,#22193f);display:grid;place-items:center;font-size:32px;border:1px solid var(--line)}
.portrait b{position:absolute;right:-6px;bottom:-6px;background:var(--accent);color:#2a1a00;font-size:12px;border-radius:10px;padding:0 6px;line-height:18px}
.bars{flex:1;display:flex;flex-direction:column;gap:3px}
.nameRow{display:flex;justify-content:space-between;font-weight:700;font-size:15px;line-height:1}
#pMoodTag{font-size:11px;color:var(--accent);font-weight:600}
.bar{position:relative;height:12px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden}
.bar i,.bar em{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .2s}
.bar.hp i{background:linear-gradient(90deg,#ff4f6a,#ff8a5a)} .bar.hp em{background:rgba(140,220,255,.7)}
.bar.en{height:7px} .bar.en i{background:linear-gradient(90deg,#4ad0ff,#8affc8)} .bar.en span{display:none}
.bar span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 1px 2px #000}
.needs{display:flex;gap:10px;font-size:12px;color:var(--muted)} .needs b{color:var(--text)} .needs .low b{color:var(--bad)}
#topRight{position:absolute;right:calc(12px + var(--safeR));top:calc(10px + var(--safeT));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#clock{background:var(--panel);border:1px solid var(--line);padding:2px 10px;border-radius:10px;font-size:13px;font-weight:700}
#minimap{width:150px;height:150px;border-radius:50%;border:3px solid rgba(255,255,255,.75);box-shadow:0 4px 18px rgba(0,0,0,.45);background:#2a3a2a}
.trBtns{display:flex;gap:6px;pointer-events:auto}
.trBtns button,#touch .tb{pointer-events:auto}
.trBtns button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px}
#district{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:24px;font-weight:800;letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:0}
#district.show{animation:dist 3.4s ease}
@keyframes dist{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#buffs{position:absolute;left:calc(12px + var(--safeL));top:calc(92px + var(--safeT));display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#buffs span{background:var(--panel);border:1px solid var(--line);padding:1px 9px;border-radius:9px;font-size:12px}
#prompt{position:absolute;left:50%;bottom:calc(120px + var(--safeB));transform:translate(-50%,10px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 16px 7px 8px;display:flex;align-items:center;gap:8px;font-weight:700;opacity:0;transition:.18s;white-space:nowrap;max-width:90vw}
#prompt.on{opacity:1;transform:translate(-50%,0)}
#prompt .pi{font-size:22px}
kbd{display:inline-block;min-width:24px;padding:0 6px;border-radius:7px;background:#fff;color:#1a1530;font:700 13px/22px system-ui,sans-serif;text-align:center;box-shadow:0 2px 0 #b8b0d8}
/* ability bar */
#abilityBar{position:absolute;left:50%;bottom:calc(16px + var(--safeB));transform:translateX(-50%);display:flex;gap:14px;align-items:flex-end}
#abilityBar .grp{display:flex;gap:6px}
.ab{position:relative;width:58px;height:58px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:28px;overflow:hidden}
.grp.ult .ab{width:66px;height:66px;border-color:rgba(255,207,74,.45)}
.ab.empty{opacity:.35} .ab.on{border-color:#c8d8ff;box-shadow:0 0 12px rgba(200,216,255,.6)} .res .stats{font-size:14px;color:var(--muted);font-weight:600}
.ab kbd{position:absolute;bottom:3px;right:3px;font-size:10px;line-height:15px;min-width:18px;padding:0 3px}
.ab .cd,.tb .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.62);pointer-events:none}
.ab.ready,.tb.ready{border-color:var(--accent);box-shadow:0 0 16px rgba(255,207,74,.6);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 26px rgba(255,207,74,.95)}}
#spirit{position:absolute;left:50%;bottom:calc(84px + var(--safeB));transform:translateX(-50%);width:300px;height:10px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--line)}
#spirit i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a5cff,#ff70d0,#ffcf4a);transition:width .2s}
#spirit span{position:absolute;inset:0;font-size:8px;line-height:10px;text-align:center;font-weight:800;letter-spacing:.2em}
#spirit.full{box-shadow:0 0 14px #ffcf4a}
#bossBar{position:absolute;left:50%;top:calc(70px + var(--safeT));transform:translateX(-50%);width:min(560px,70vw);text-align:center;opacity:0;transition:.4s}
#bossBar.on{opacity:1}
#bossBar span{font-weight:800;font-size:18px;letter-spacing:.1em;text-shadow:0 0 12px #ff3a6a}
#bossBar div{height:14px;border-radius:8px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,90,140,.5)}
#bossBar i{display:block;height:100%;background:linear-gradient(90deg,#ff3a6a,#c040ff);transition:width .15s}
#nums{position:absolute;inset:0;overflow:hidden}
.num{position:absolute;left:0;top:0;font-weight:800;font-size:18px;text-shadow:0 2px 3px #000,0 0 6px rgba(0,0,0,.6);white-space:nowrap;will-change:transform}
.num.big{font-size:26px}
.ebar{position:absolute;left:0;top:0;width:54px;height:6px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.ebar i{display:block;height:100%;background:#ff4f6a} .ebar.stun i{background:#ffe060} .ebar.poison i{background:#80ff50}
#toasts{position:absolute;left:50%;top:calc(56px + var(--safeT));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(620px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:14px;font-weight:600;text-align:center;animation:tin .25s ease;transition:opacity .5s, transform .5s;backdrop-filter:blur(6px)}
.toast.good{border-color:rgba(91,227,138,.6)} .toast.bad{border-color:rgba(255,90,106,.7)} .toast.warn{border-color:rgba(255,176,58,.7)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(26px,5vw,52px);font-weight:800;letter-spacing:.04em;text-shadow:0 0 24px rgba(160,80,255,.9),0 3px 6px #000;opacity:0}
#banner.show{animation:ban 2.6s ease}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;opacity:0}
#flash.hurt{background:radial-gradient(ellipse at center,transparent 50%,rgba(255,30,60,.55))}
#flash.ult{background:radial-gradient(circle,var(--c,#fff) 0%,transparent 70%);mix-blend-mode:screen}
#flash.perfect{background:radial-gradient(ellipse at center,transparent 45%,var(--c,#fff) 140%);box-shadow:inset 0 0 0 3px var(--c,#fff)}
#flash.go{animation:fl .5s ease}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s}
#fade.purple{background:radial-gradient(circle,#2a0a40,#000)}
#fade.on{opacity:1}
#fps{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);font:12px monospace;color:#9f9;z-index:9;display:none;pointer-events:none}
/* ── Touch ── */
#touch{position:absolute;inset:0}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);opacity:0;transition:opacity .15s;left:110px;top:70%}
#joy.on{opacity:1}
#joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.4)}
#tBtns{position:absolute;right:calc(14px + var(--safeR));bottom:calc(14px + var(--safeB));width:330px;height:250px}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,16,40,.55);color:#fff;font-size:24px;display:grid;place-items:center;overflow:hidden;backdrop-filter:blur(4px)}
.tb.down{transform:scale(.9);background:rgba(255,255,255,.3)}
.tb.big{width:84px;height:84px;font-size:34px}
#tBtns.city .jump{right:0;bottom:0} #tBtns.city .interact{right:96px;bottom:0;opacity:0;transform:scale(.6);transition:.15s;border-color:var(--accent)} #tBtns.city .interact.on{opacity:1;transform:scale(1.1)}
#tBtns.city .instinct{right:8px;bottom:96px} #tBtns.city .sit{right:80px;bottom:76px} #tBtns.city .voice{right:150px;bottom:110px;width:48px;height:48px;font-size:20px}
#tBtns.rift .atk1{right:0;bottom:0} #tBtns.rift .atk2{right:92px;bottom:2px} #tBtns.rift .sk1{right:150px;bottom:44px} #tBtns.rift .sk2{right:126px;bottom:108px} #tBtns.rift .sk3{right:70px;bottom:150px}
#tBtns.rift .ul1{right:4px;bottom:164px;border-color:rgba(255,207,74,.6)} #tBtns.rift .ul2{right:70px;bottom:214px;border-color:rgba(255,207,74,.6)} #tBtns.rift .dodge{right:214px;bottom:0} #tBtns.rift .guard{right:282px;bottom:0;width:66px;height:66px} #tBtns.rift .parry{right:232px;bottom:72px;border-color:rgba(255,208,64,.7)} #tBtns.rift .jump{right:8px;bottom:94px;width:50px;height:50px;font-size:20px}
/* ── Screens ── */
#screen{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#screen.title{background:radial-gradient(ellipse at 50% 60%,rgba(22,18,42,.2),rgba(16,12,32,.75))}
.titleWrap,.loading{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.logo{display:flex;flex-direction:column;line-height:.85;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6))}
.logo .l1{font-size:clamp(46px,9vw,96px);font-weight:800;letter-spacing:.18em;background:linear-gradient(180deg,#e6d8ff,#8a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l2{font-size:clamp(34px,6.5vw,70px);font-weight:800;letter-spacing:.12em;color:#ffcf4a}
.tag{color:#e8e0ff;font-size:clamp(14px,2vw,19px);text-shadow:0 2px 6px #000}
button.big{font-size:22px;font-weight:800;padding:12px 44px;border-radius:999px;border:none;background:linear-gradient(180deg,#ffd75e,#ffad2a);color:#2a1500;box-shadow:0 6px 0 #b86a00,0 10px 30px rgba(255,170,40,.4);transition:transform .1s}
button.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b86a00}
.row{display:flex;gap:10px}
.row button,.btns button,.menuList button,.abCard button,.selHead button{font-size:16px;font-weight:700;padding:8px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--text)}
.foot{color:var(--muted);font-size:13px;max-width:560px;text-shadow:0 1px 3px #000}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#ffcf4a;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
/* select */
#screen.select{background:linear-gradient(90deg,rgba(16,12,32,.92) 0%,rgba(16,12,32,.55) 27%,rgba(16,12,32,0) 32%,rgba(16,12,32,0) 68%,rgba(16,12,32,.6) 72%,rgba(16,12,32,.92) 100%)}
.selWrap{position:absolute;inset:0;padding:calc(14px + var(--safeT)) calc(16px + var(--safeR)) 14px calc(16px + var(--safeL))}
.selHead{position:absolute;left:calc(16px + var(--safeL));top:calc(12px + var(--safeT));display:flex;gap:12px;align-items:center}
.selHead h1{margin:0;font-size:clamp(18px,2.6vw,28px)}
.selHead button{padding:4px 12px}
.selGrid{position:absolute;left:calc(16px + var(--safeL));top:calc(70px + var(--safeT));bottom:20px;width:26%;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow:auto}
.sp{position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-weight:700;font-size:16px}
.sp .e{font-size:38px;line-height:1.1} .sp small{color:var(--muted);font-size:11px;font-weight:600}
.sp.on{border-color:var(--accent);background:rgba(255,207,74,.14);box-shadow:0 0 0 3px rgba(255,207,74,.18)}
.sp .lv{position:absolute;top:4px;right:8px;font-size:11px;font-style:normal;color:var(--accent)}
.selInfo{position:absolute;right:calc(16px + var(--safeR));top:calc(14px + var(--safeT));bottom:16px;width:28%;display:flex;flex-direction:column;overflow:auto;padding-right:4px}
.selInfo h2{margin:0;font-size:clamp(24px,3vw,36px);line-height:1.1}
.group{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.selInfo p{color:#ddd6ff;margin:6px 0;font-size:14.5px;line-height:1.35}
.selInfo ul{margin:4px 0 8px;padding-left:18px;font-size:13.5px;color:#cfc8f0;line-height:1.35}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0} .stat span{width:74px;color:var(--muted)} .stat div{flex:1;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden} .stat i{display:block;height:100%;background:linear-gradient(90deg,#8a5cff,#ffcf4a)}
.coats{display:flex;align-items:center;gap:10px;margin:10px 0 12px;font-size:13px;color:var(--muted)} #sCoats{display:flex;gap:6px;align-items:center;flex-wrap:wrap} #sCoats em{font-style:normal;color:var(--text);font-size:13px}
.coat{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3)} .coat.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,207,74,.35)}
.selInfo .big{margin-top:auto;align-self:stretch;position:sticky;bottom:0;z-index:2}
.selHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:var(--muted);font-size:12px}
@media (max-width:820px) and (orientation:portrait){
  #screen.select{background:linear-gradient(180deg,rgba(16,12,32,.5) 0%,rgba(16,12,32,0) 8%,rgba(16,12,32,0) 40%,rgba(16,12,32,.95) 44%)}
  .selGrid{top:auto;bottom:auto;position:absolute;left:12px;right:12px;width:auto;top:46%;grid-template-columns:repeat(6,1fr);gap:6px}
  .sp{padding:6px 2px;font-size:11px} .sp .e{font-size:26px} .sp small{display:none}
  .selInfo{left:12px;right:12px;width:auto;top:calc(46% + 74px);bottom:12px}
  .selHint{display:none}
}
@media (max-height:500px){ .selInfo p,.selInfo ul{font-size:12px} .selInfo h2{font-size:22px} .sp{padding:6px} .sp .e{font-size:28px} .selGrid{top:56px} }
/* ── Modal ── */
#modal{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;background:rgba(8,6,18,.55);backdrop-filter:blur(3px);padding:16px}
#modal .card{background:linear-gradient(180deg,rgba(40,32,72,.97),rgba(24,19,46,.97));border:1px solid var(--line);border-radius:20px;padding:20px 22px;max-width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s ease}
#modal.wide .card{max-width:min(980px,96vw)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#modal h2{margin:0 0 6px;font-size:26px} #modal h3{margin:14px 0 6px;font-size:17px;color:var(--accent)} #modal h3 small{color:var(--muted);font-weight:600}
#modal p{color:#ddd6ff;line-height:1.45;margin:6px 0}
.btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btns .primary,.menuList .primary{background:linear-gradient(180deg,#ffd75e,#ffad2a);color:#2a1500;border:none}
.btns .danger{border-color:rgba(255,90,106,.6);color:#ffb0b8}
.menuList{display:flex;flex-direction:column;gap:8px;min-width:260px;margin-top:10px} .menuList button{text-align:left}
.badge{background:var(--accent);color:#2a1500;border-radius:8px;padding:0 6px;font-size:12px;margin-left:6px}
#modal.mist .card{border-color:rgba(160,80,255,.6);box-shadow:0 0 60px rgba(120,40,200,.4);text-align:center}
.mistIcon{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle,#000 30%,#2a0a40 60%,transparent 70%);box-shadow:0 0 30px #8a40ff;animation:mi 2s infinite alternate}
@keyframes mi{to{transform:scale(1.12);box-shadow:0 0 50px #c070ff}}
.tier{font-size:20px;color:#d8a8ff;letter-spacing:.1em;font-weight:800}
.warnText{color:var(--warn)!important}
.story{font-size:16px}
.settings{display:flex;flex-direction:column;gap:12px;min-width:min(380px,80vw)} .settings label{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:600}
.settings select,.settings input[type=range]{width:55%;font-family:inherit;font-size:15px;padding:4px;border-radius:8px}
.keys{border-collapse:collapse;width:100%;font-size:14px} .keys td{padding:4px 6px;border-bottom:1px solid var(--line)} .keys td:first-child{color:var(--muted)}
.spLine{color:var(--muted);font-size:14px} .spLine b{color:var(--accent);font-size:18px}
.abList{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} .abList h3{grid-column:1/-1}
.abCard{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:8px;opacity:.75}
.abCard.owned{opacity:1} .abCard.eq{border-color:rgba(255,207,74,.6);background:rgba(255,207,74,.08)}
.abCard .ic{font-size:30px;width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,.3);display:grid;place-items:center;flex:none}
.abCard .tx{flex:1;min-width:0} .abCard .tx b{display:block} .abCard small{color:var(--muted)} .abCard p{font-size:12.5px!important;margin:2px 0!important}
.abCard .act button{padding:6px 10px;font-size:13px;white-space:nowrap} .abCard button[disabled]{opacity:.4}
.tagEq{font-size:12px;color:var(--accent);font-weight:700}
.jGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px} .jl{list-style:none;padding:0;margin:0;font-size:14px;line-height:1.6} .jl li.done{color:var(--good)} .jl small{color:var(--muted)}

.res{display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:700;margin:12px 0;align-items:center}
